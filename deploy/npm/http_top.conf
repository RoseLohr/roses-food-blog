# Kompression am Ursprung — Nginx Proxy Manager (OpenResty)
# ============================================================================
#
# ZIEL AUF DEM SERVER
#   /data/nginx/custom/http_top.conf   (IM NPM-Container, nicht auf dem Host)
#
# NPM bindet diese Datei am Anfang seines http-Blocks ein
# (`include /data/nginx/custom/http_top[.]conf;`). Die eckigen Klammern machen
# den Einschluss optional — fehlt die Datei, startet nginx trotzdem. Genau
# deshalb ist das der richtige Ort: Er überlebt NPM-Updates, ohne dass ein
# eigenes Image gebaut werden müsste.
#
# WARUM ES DIESE DATEI GIBT (Erhebung 2026-08-21, audit/11-infrastruktur-befund.md)
# ---------------------------------------------------------------------------
# Die gesamte aktive Kompressionskonfiguration des Proxys bestand aus EINER
# Zeile: `gzip on;` in /etc/nginx/nginx.conf. Ohne `gzip_types` gilt nginx'
# Voreinstellung, und die umfasst ausschließlich `text/html`. Gemessen am
# Ursprung, Bytes auf der Leitung:
#
#   /                 135.424 identity → 21.263 gzip   (−84 %)
#   …/*.css            67.818 identity → 67.818 gzip   ( −0 %)
#   …/*.js              5.364 identity →  5.364 gzip   ( −0 %)
#
# Dem Besucher fiel das nicht auf, weil Cloudflare nachkomprimiert. Bezahlt hat
# es der Ursprungs-Hop: 67,8 KB statt ~13 KB bei jedem Cache-Miss — und einen
# Miss gibt es nach jedem Deployment für jede neue Chunk-URL.
#
# KEIN BROTLI — und das ist eine Entscheidung, kein Versehen
# ---------------------------------------------------------------------------
# `nginx -V` im Proxy-Container zeigt OpenResty 1.29.2.5 mit genau einem
# dynamischen Zusatzmodul: geoip2. Brotli ist nicht einkompiliert. Nachrüsten
# hieße, ein eigenes OpenResty zu bauen und dauerhaft gegen Upstream zu
# pflegen — für einen Gewinn, der nur den internen Hop beträfe, denn der
# Browser bekommt sein brotli bereits von Cloudflare. Fällt Cloudflare später
# weg, kehrt diese Entscheidung zurück (audit/11-infrastruktur-befund.md §4).
#
# text/html steht bewusst NICHT in der Liste: nginx komprimiert es immer, und
# ein Eintrag erzeugt `[warn] duplicate MIME type "text/html"`.
#
# EINSPIELEN UND PRÜFEN
# ---------------------------------------------------------------------------
#   podman exec nginx-proxy-manager mkdir -p /data/nginx/custom
#   podman cp deploy/npm/http_top.conf nginx-proxy-manager:/data/nginx/custom/http_top.conf
#   podman exec nginx-proxy-manager nginx -t     # MUSS erfolgreich sein
#   podman exec nginx-proxy-manager nginx -s reload
#   ./scripts/regime/kompression-pruefen.sh --basis "$BASE_URL" \
#       --aufloesen 127.0.0.1 --ebene ursprung
#
# Der letzte Schritt ist die Abnahme — er misst, statt der Konfiguration zu
# glauben. Genau dieselbe Prüfung läuft nach jedem Deployment (deploy.sh).
# ============================================================================

gzip on;

# Ohne `gzip_vary` fehlt `Vary: Accept-Encoding` an der komprimierten Antwort.
# Cloudflare setzt heute ein eigenes und fängt das ab — korrekt ist es nicht:
# Jeder Zwischenspeicher dürfte die gzip-Antwort einem Client ausliefern, der
# gar kein gzip angefragt hat.
gzip_vary on;

# Voreinstellung ist `off` — dann komprimiert nginx keine Antwort auf eine
# Anfrage mit `Via`-Kopf. Cloudflare schickt keinen, deshalb wirkte gzip für
# HTML bisher trotzdem. Hinter einem CDN ist `any` die belastbare Wahl: sie
# hängt nicht daran, welche Köpfe der Vorgelagerte zufällig setzt.
gzip_proxied any;

# Stufe 5: gemessen am geteilten Sockel dieser Anwendung liegt der Zugewinn
# von 5 auf 9 im niedrigen einstelligen Prozentbereich, die Rechenzeit steigt
# dabei deutlich. Auf einer Antwort, die bei JEDEM Aufruf neu komprimiert wird
# (die Seiten sind dynamisch), ist das der falsche Tausch.
gzip_comp_level 5;

# Unter ~256 Bytes kostet der gzip-Rahmen mehr, als der Inhalt einspart.
gzip_min_length 256;

# text/x-component ist der Typ, unter dem Next.js seine RSC-Nutzlast ausliefert
# (die `?_rsc=`-Vorabrufe des Routers) — ohne den Eintrag bleibt jede
# Weiternavigation unkomprimiert.
gzip_types
  text/plain
  text/css
  text/xml
  text/javascript
  text/x-component
  application/javascript
  application/json
  application/xml
  application/rss+xml
  application/manifest+json
  application/ld+json
  image/svg+xml;
