# DAST (A-08) — dynamische Sicherheitsanalyse gegen die laufende App.
# Startet die gebaute App in CI und lässt OWASP ZAP (Baseline) laufen. Der Report
# wird als Artefakt hochgeladen.
#
# KORREKTUR 08/2026: Hier stand, in CI fehle „die nginx-Schicht", in der die
# CSP-/Header sitzen — deshalb liefen die passiven Header-Regeln nur informativ.
# Das war für vier von fünf Regeln falsch. Content-Security-Policy,
# X-Content-Type-Options, X-Frame-Options und Permissions-Policy setzt die
# ANWENDUNG, für jede Route (next.config.ts, source: "/:path*"); nachgemessen an
# der gebauten App in genau dieser Konfiguration. Sie fehlen in CI also nicht,
# und die vier Regeln stehen wieder auf FAIL (.zap/rules.tsv).
#
# Offen bleibt allein HSTS: Die Anwendung setzt es bewusst nicht, und WO es
# gesetzt wird, ist nicht erhoben. Regel 10035 bleibt deshalb auf WARN — mit
# einer offenen Frage als Vermerk, nicht mit einer Behauptung.
name: DAST

on:
  schedule:
    - cron: "40 3 * * 1" # wöchentlich Mo 03:40 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write # Meldepfad: Fehlschlag wird als Issue sichtbar

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    env:
      DATA_DIR: /tmp/dast-data
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: DB migrieren
        run: mkdir -p "$DATA_DIR" && node scripts/migrate.mjs
      - name: Build
        run: npm run build
      - name: App starten (Hintergrund) + Health abwarten
        run: |
          npm start &
          for i in $(seq 1 30); do
            curl -sf "http://localhost:3000/health" && break || sleep 2
          done
      - name: ZAP Baseline
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:3000"
          rules_file_name: ".zap/rules.tsv"
          fail_action: true # scheduled: fällt bei ECHTEN Funden (Header-Regeln stehen auf WARN)
          allow_issue_writing: false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: |
            report_html.html
            report_md.md
      # Lighthouse stand hier — hinter dem fail-closed ZAP-Schritt und ohne
      # `if:`. Alle vier planmaessigen Laeufe endeten mit failure, der Schritt
      # wurde jedes Mal uebersprungen; zudem war er mit `|| true` entschaerft.
      # Die Messung laeuft jetzt in .github/workflows/perf-uptime.yml gegen die
      # ECHTE Domain — in CI gaebe es die betroffenen Bilder gar nicht (leere DB).

      # BEWUSST INLINE, nicht als Skript aus dem Repo (Befund gpt-5.6-sol,
      # PR #63, Runde 2): schlägt schon der Checkout fehl, existiert kein
      # Skript — der Alarm-Schritt liefe zwar, fände die Datei nicht und
      # meldete nichts. Ausgerechnet der Totalausfall des Laufs bliebe still.
      # Der Preis ist ein wiederholter Block in drei Workflows; die Alternative
      # wäre eine Kontrolle, die im wichtigsten Fall nicht greift.
      - name: Fehlschlag melden
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # OHNE GH_REPO leitet die gh-CLI das Repository aus dem git-Remote im
          # Arbeitsverzeichnis ab — nach einem fehlgeschlagenen Checkout gibt es
          # keines, und der Alarm scheitert mit „not a git repository". Genau im
          # gemeldeten Fall (Befund gpt-5.6-sol, PR #63, Runde 3).
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh label create kadenz-alarm --force --color B60205 \
            --description "Ein wiederkehrender Lauf ist fehlgeschlagen"
          titel="Wiederkehrender Lauf fehlgeschlagen: ${{ github.workflow }}"
          text="Lauf: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Commit: ${{ github.sha }}"
          nummer=$(gh issue list --label kadenz-alarm --state open \
            --search "$titel in:title" --json number --jq '.[0].number // empty')
          if [ -n "$nummer" ]; then
            gh issue comment "$nummer" --body "$text"
          else
            gh issue create --title "$titel" --label kadenz-alarm --body "$text"
          fi
