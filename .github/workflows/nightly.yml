# Nächtliche Kadenz (A-36 fortlaufende Kalibrier-Injektion + B-02 Bootstrap-Verify).
# GitHub-Actions-schedule IST der Cron-Host — kein separater Server nötig.
name: Nightly-Kadenz

on:
  schedule:
    - cron: "17 3 * * *" # täglich 03:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write # Meldepfad: Fehlschlag wird als Issue sichtbar
  checks: read # Bezugspunkt des Migrations-Gates (B30/B32), nur lesend

jobs:
  cadence:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # B-02: Bootstrap von Grund auf verifizieren (frische Umgebung).
      - run: npm ci --no-audit --no-fund
      - name: Kalibrierung fortlaufend (A-36, --strict — fängt jeden aktiven Seed)
        run: node scripts/regime/calibration/inject.mjs --strict
      # `npm test` enthält das Migrations-Gate gegen den AUSGELIEFERTEN Stand
      # (tests/migrationen-reihenfolge.test.ts). Aus einem flachen Checkout
      # gibt es diesen Stand nicht — `origin/main` zeigt auf HEAD, `HEAD^1`
      # ist nicht geholt — und seit #144 den stillen Durchmarsch des Tests
      # entfernt hat, war die Kadenz jede Nacht rot (B32). Derselbe Schritt wie
      # im Gate von ci.yml; die Kadenz nimmt den Elternteil der Spitze, denn
      # die Spitze selbst wäre ein Spiegel (B30).
      - name: Bezugspunkt für das Migrations-Gate bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          basis="$(bash scripts/regime/gate-bezugspunkt.sh --aus-ereignis)"
          echo "MIGRATIONS_BASIS=$basis" >> "$GITHUB_ENV"
      - name: Tests (Bootstrap-Verify)
        run: npm test
      - name: Build (Bootstrap-Verify)
        run: npm run build
      - name: Abhängigkeits-Existenz + Alter (C-03 Registry-Alters-Kadenz)
        run: |
          node scripts/regime/deps-existence.mjs
          echo "Neu registrierte/auffällige Pakete (informativ):"
          npm outdated || true
      - name: Regime-Gates erneut (Drift-Erkennung)
        run: |
          node scripts/regime/constitution-hash.mjs --verify
          node scripts/regime/mandate-hash.mjs --verify
          node scripts/regime/data-map.mjs --selftest
          node scripts/regime/authz-coverage.mjs --selftest
          node scripts/regime/provenance-reconstruct.mjs --selftest

      # BEWUSST INLINE, nicht als Skript aus dem Repo (Befund gpt-5.6-sol,
      # PR #63, Runde 2): schlägt schon der Checkout fehl, existiert kein
      # Skript — der Alarm-Schritt liefe zwar, fände die Datei nicht und
      # meldete nichts. Ausgerechnet der Totalausfall des Laufs bliebe still.
      # Der Preis ist ein wiederholter Block in drei Workflows; die Alternative
      # wäre eine Kontrolle, die im wichtigsten Fall nicht greift.
      - name: Fehlschlag melden
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # OHNE GH_REPO leitet die gh-CLI das Repository aus dem git-Remote im
          # Arbeitsverzeichnis ab — nach einem fehlgeschlagenen Checkout gibt es
          # keines, und der Alarm scheitert mit „not a git repository". Genau im
          # gemeldeten Fall (Befund gpt-5.6-sol, PR #63, Runde 3).
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh label create kadenz-alarm --force --color B60205 \
            --description "Ein wiederkehrender Lauf ist fehlgeschlagen"
          titel="Wiederkehrender Lauf fehlgeschlagen: ${{ github.workflow }}"
          text="Lauf: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Commit: ${{ github.sha }}"
          nummer=$(gh issue list --label kadenz-alarm --state open \
            --search "$titel in:title" --json number --jq '.[0].number // empty')
          if [ -n "$nummer" ]; then
            gh issue comment "$nummer" --body "$text"
          else
            gh issue create --title "$titel" --label kadenz-alarm --body "$text"
          fi
