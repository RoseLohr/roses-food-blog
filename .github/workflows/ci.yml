# Deterministischer Policy-Gate (Mandat A-01/B-01, Verfassung Artikel I).
# Bis zu diesem Workflow gab es GAR KEINE CI — der Kernbefund des Audits.
# Jeder Push/PR durchläuft hier blockierende, maschinelle Prüfungen; kein
# manueller Promote-Schritt, kein Soft-Fail (`|| true`/continue-on-error) auf
# den Gate-Bedingungen.
name: CI-Gate

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  # ---- Merge-Gate: typecheck + lint(a11y/standards) + test + build ----------
  gate:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Das Migrations-Gate vergleicht das Journal gegen den AUSGELIEFERTEN
      # Stand — ohne diesen Bezugspunkt prüft es nur den Anstieg im Journal und
      # ließe genau den chronologisch aufgelösten Merge-Konflikt durch. Der
      # Checkout holt nur den PR-Stand, also wird `origin/main` hier nachgeholt.
      # Ist er unlesbar, ist das ein Befund, kein Durchwinken — deshalb kein
      # `|| true`. `--depth=1` genügt: gelesen wird eine einzige Datei an der
      # Spitze von main.
      - name: Bezugspunkt für das Migrations-Gate holen (origin/main)
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck
      - name: Lint (Standards + Barrierefreiheit, blockierend)
        run: npm run lint
      - name: Quelltext-Gates (Stubs A-16, Modell-Aliase B-13)
        run: node scripts/regime/source-gates.mjs
      - name: Quelltext-Gates-Selbsttest (A-36)
        run: node scripts/regime/source-gates.mjs --selftest
      - name: Doku-Gates (veraltete Anleitung, tote Nummern, Pfadverweise)
        run: node scripts/regime/doku-gate.mjs
      - name: Doku-Gates-Selbsttest (A-36)
        run: node scripts/regime/doku-gate.mjs --selftest
      - name: Erhebungs-Maskierung-Selbsttest (A1 — die Ausgabe ist weitergabesicher)
        run: bash scripts/regime/erhebung.sh --selftest
      - name: Migrations-Journal streng aufsteigend (still übersprungene Migration)
        run: node scripts/regime/migrations-order.mjs
      - name: Migrations-Journal-Selbsttest
        run: node scripts/regime/migrations-order.mjs --selftest
      - name: SEO-/LLM-Gate (Routen registriert, Artefakte laufzeit-dynamisch, ein Ursprung)
        run: node scripts/regime/seo-gate.mjs
      - name: SEO-Gate-Selbsttest (A-36)
        run: node scripts/regime/seo-gate.mjs --selftest
      - name: Responsive-Images-Gate (srcSet⇒sizes, keine Großbilder als Thumbnail)
        run: node scripts/regime/responsive-images.mjs
      - name: Responsive-Images-Selbsttest (A-36)
        run: node scripts/regime/responsive-images.mjs --selftest
      - name: Cache-Integritäts-Gate (immutable nur auf ?v-versionierten Font-/Brand-URLs)
        run: node scripts/regime/font-cache.mjs
      - name: Cache-Integritäts-Selbsttest (A-36, Fonts + Brand)
        run: node scripts/regime/font-cache.mjs --selftest
      - name: Klon-Tripwire (A-07, Schwelle 5,5 %)
        run: npx jscpd --config .jscpd.json --silent
      - name: Secret-Scan (B-06, STOP-SHIP)
        run: node scripts/regime/secret-scan.mjs
      - name: Secret-Scan-Selbsttest (A-36, STOP-SHIP-Kontrolle fängt nachweislich)
        run: node scripts/regime/secret-scan.mjs --selftest
      - name: Gewaltenteilung (B-35, CODEOWNERS deckt geschützte Pfade)
        run: node scripts/regime/separation-check.mjs
      - name: Gewaltenteilungs-Selbsttest (A-36)
        run: node scripts/regime/separation-check.mjs --selftest
      - name: Gate-Selbsttest (A-01/B-01, Gate blockiert nachweislich)
        run: node scripts/regime/gate-selftest.mjs
      # Beide Skripte laufen produktiv in EIGENEN Workflows (perf-uptime.yml
      # bzw. independent-verify.yml), die nicht bei jedem Pull Request feuern.
      # Ihr Wirksamkeitsnachweis gehört trotzdem in das Gate, das die Änderung
      # an ihnen sieht — sonst prüft ihn erst der nächste Zeitplanlauf.
      - name: Lighthouse-Budget-Selbsttest (A-36)
        run: node scripts/regime/lighthouse-budget.mjs --selftest
      - name: Unabhängige-Verifikation-Selbsttest (A-36)
        run: node scripts/regime/independent-verify.mjs --selftest
      - name: Authz-Coverage (C-01, jeder Admin-Handler server-seitig geguardet)
        run: node scripts/regime/authz-coverage.mjs --selftest
      - name: KI-Fähigkeits-Guard (Track C, N/A-Reaktivierung bei Tool/RAG/Agent)
        run: node scripts/regime/ai-capability-guard.mjs --selftest
      - name: Datenkarte (C-04/C-23, kein unregistrierter PII-Store)
        run: node scripts/regime/data-map.mjs --selftest
      - name: LLM-Risiko-Matrix (C-05, keine leere Zelle)
        run: node scripts/regime/llm-matrix-check.mjs --selftest
      - name: Prompt-Scan (C-24, keine Secrets/PII im Prompt)
        run: node scripts/regime/prompt-scan.mjs --selftest
      - name: KI-Budget (C-05/B-08, Caps im KI-Pfad)
        run: node scripts/regime/ai-budget-check.mjs --selftest
      # Die Entscheidungslogik des Fremd-Vendor-Verifiers (decide, requireApprovals,
      # attestReasons, attestProof, validateRangeInputs, normalizeBase, authHeader,
      # strictAnyRefutation) hatte bis hierher KEINE automatisierte Abdeckung: der
      # --selftest existierte, wurde aber von keinem Workflow und keinem npm-Script
      # aufgerufen. Ein gut gebauter, nie ausgefuehrter Selbsttest ist kein Test.
      - name: Fremd-Vendor-Verifier Selbsttest (A-01/A-39, Entscheidungslogik)
        run: node scripts/regime/independent-verify.mjs --selftest
      - name: Trust-Boundary-Detektor (C-02, neue Integration deklariert)
        run: node scripts/regime/boundary-check.mjs --selftest
      - name: Provenance-Rekonstruktion (C-37, jede Datei einer Owning-Role)
        run: node scripts/regime/provenance-reconstruct.mjs --selftest
      - name: Architektur-Fitness (A-05/A-09, keine server-only-Importe im Client)
        run: node scripts/regime/architecture-fitness.mjs --selftest
      - name: Spec-Coverage (A-04, jedes Kernmodul getestet)
        run: node scripts/regime/spec-coverage.mjs --selftest
      - name: Prompt-Lifecycle (B-05, Prompt-Änderung = Version-Bump + Lock)
        run: node scripts/regime/prompt-lifecycle.mjs --selftest
      - name: Rollback-Fähigkeit + Drill (A-06/B-11)
        run: node scripts/regime/rollback-check.mjs --selftest
      # Entdeckung statt Aufzaehlung: eine Liste vergisst neue Skripte. Bis
      # 08/2026 waren nur 2 von 8 Shell-Dateien geprueft — darunter NICHT
      # bootstrap.sh, das die .env per Heredoc schreibt.
      - name: Shell-Syntax (alle *.sh)
        run: |
          set -euo pipefail
          # Ohne --others --exclude-standard listet git nur VERFOLGTE Dateien:
          # eine frisch geschriebene .sh waere im lokalen Gate-Lauf unsichtbar
          # (Vorfall 2026-08-21, tests/gate-sichtbarkeit.test.ts).
          #
          # Und NUL-getrennt statt zeilen-/wortweise: `for f in $dateien` zerlegt
          # an Leerzeichen. Gemessen an einer Datei „mit luecke.sh": Sie zerfaellt
          # in zwei nicht existierende Pfade, `bash -n` meldet „No such file" —
          # und der echte Syntaxfehler IN der Datei wird nie geprueft. Mit
          # --others sind unverfolgte Dateien dabei, bei denen so etwas
          # wahrscheinlicher ist als bei verfolgten.
          anzahl=0
          while IFS= read -r -d "" f; do
            echo "bash -n $f"
            bash -n "$f"
            anzahl=$((anzahl + 1))
          done < <(git ls-files -z --cached --others --exclude-standard '*.sh')
          test "$anzahl" -gt 0 || { echo "Keine Shell-Dateien gefunden — pruefe den Glob."; exit 1; }
          echo "$anzahl Shell-Dateien geprueft."
      - name: Kalibrierung (A-36, Kontrollen fangen ihre Seeds — inkl. Track C)
        run: node scripts/regime/calibration/inject.mjs --strict
      - name: Tests (vitest)
        run: npm test
      - name: Build (next, standalone)
        run: npm run build
      # Erst NACH dem Build — vorher gibt es die Chunks nicht.
      - name: JS-Budget (First Load, gemessen am Artefakt)
        run: node scripts/regime/bundle-budget.mjs
      - name: JS-Budget-Selbsttest (A-36)
        run: node scripts/regime/bundle-budget.mjs --selftest
      - name: Findings-Gate (Report; scharf sobald Blocker geschlossen)
        run: node scripts/regime/findings-gate.mjs
      - name: Verfassung geladen & gehasht (Session-Steuer, §9.10.5)
        run: node scripts/regime/constitution-hash.mjs --verify

  # ---- E2E-Gate: Laufzeit-Guardrails im echten Browser ----------------------
  # Root-Fix eines Audit-Befunds (07/2026): bis hierher führte KEIN Workflow
  # Playwright aus — die dynamische Bild-Auslieferungs-Guardrail
  # (tests/e2e/bild-auslieferung.spec.ts), die axe-A11y-Prüfung und die
  # Laufzeit-Regressionstests, auf die die Regime-Skripte ausdrücklich
  # verweisen, waren nur lokale Disziplin. Jetzt blockierend in CI.
  e2e:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
        env:
          # Browser kommt gezielt im nächsten Schritt, nicht via postinstall.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Chromium installieren (inkl. System-Abhängigkeiten)
        run: npx playwright install --with-deps chromium
      - name: E2E (Playwright gegen Produktions-Build — Bild-Auslieferung, Slider, Galerie, axe-A11y)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore

  # ---- Image-Gate: der Bauplan wird AUSGEFÜHRT, nicht nur gelesen -----------
  # Root-Fix des Fehlschlags vom 2026-08-16 (Commit 298e6b6): Bis hierher hat
  # KEIN Workflow je das Container-Image gebaut. `npm ci` scheiterte deshalb
  # zum ersten Mal auf dem Produktionsserver — nach dem Merge, beim Deploy.
  #
  # Der Unterschied ist nicht theoretisch: Die Runner von GitHub bringen Python
  # und einen Compiler mit, das schlanke Basisimage nicht. Genau deshalb lief
  # `npm ci` in den anderen Jobs durch (npm übersetzte better-sqlite3 aus
  # Quelltext) und im Image nicht. Ein Gate, das nur `npm ci` auf dem Runner
  # ausführt, prüft also einen ANDEREN Abhängigkeitsbaum als den ausgelieferten.
  #
  # Gebaut wird das vollständige Image — nicht nur die deps-Stufe. Die Stufen
  # sind durch nichts aneinander gebunden; erst der Lauf über alle drei zeigt,
  # dass am Ende ein startfähiges Image steht. Anschließend wird das Ergebnis
  # BENUTZT: better-sqlite3 aus dem fertigen Standalone-Verzeichnis, denn die
  # deps-Stufe ist nicht das Laufzeit-Image.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Container-Image bauen (wie deploy.sh)
        run: |
          docker build -f Containerfile \
            --build-arg APP_COMMIT="${GITHUB_SHA::7}" \
            -t roses-blog:ci .
      - name: Native Module im FERTIGEN Image benutzen (nicht nur laden)
        run: |
          docker run --rm --entrypoint node roses-blog:ci -e "
            const D = require('better-sqlite3');
            const db = new D(':memory:');
            db.exec('create table t(a)');
            db.prepare('insert into t values (?)').run(42);
            if (db.prepare('select a from t').get().a !== 42) {
              throw new Error('better-sqlite3 liefert falsche Daten');
            }
            require('sharp');
            console.log('OK: better-sqlite3 und sharp arbeiten im Laufzeit-Image');
          "

  # ---- Sicherheits-Gate: Abhängigkeiten, Existenz, SBOM ---------------------
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Zwei blockierende Audit-Gates (Ausnahme F5, audit/10-exceptions-ledger.md):
      # 1. PRODUKTIONS-Audit (Runtime-Abhängigkeiten): fail-closed ab „high",
      #    KEINE Allowlist — nichts Verwundbares wird ausgeliefert.
      # 2. Voller Audit inkl. Dev-Ketten: ebenfalls BLOCKIEREND via
      #    dev-audit-gate.mjs. Erlaubt sind ausschließlich die ratifizierten
      #    F5-Advisories (governance/dev-audit-exceptions.json, je konkretes
      #    GHSA); jedes andere HIGH/CRITICAL blockiert. Auto-Tripwire: liefert
      #    Upstream den Fix, wird der Gate rot, bis die obsolete Ausnahme
      #    entfernt ist — F5 kann nicht stillschweigend weiterleben.
      - name: npm audit Produktion (blockiert ab „high", fail-closed, ohne Allowlist)
        run: npm audit --omit=dev --audit-level=high
      - name: Dev-Audit-Gate (blockierend; nur ratifizierte F5-Advisories, Auto-Tripwire)
        run: node scripts/regime/dev-audit-gate.mjs
      - name: Dev-Audit-Gate-Selbsttest (A-36)
        run: node scripts/regime/dev-audit-gate.mjs --selftest
      - name: Dependency-Existenzprüfung (Anti-Slopsquatting, B-04)
        run: node scripts/regime/deps-existence.mjs
      - name: SBOM erzeugen (CycloneDX, A-38/B-09)
        # Gepinnt (B-13: kein floating @latest) — reproduzierbare CI.
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.0 --output-file sbom.json
      - name: AI-BOM konsistent mit Code (C-26)
        run: node scripts/regime/ai-bom.mjs --verify
      - name: Mandat-Provenance verifiziert (C-26/C-37, fail-closed)
        run: node scripts/regime/mandate-hash.mjs --verify
      - name: Lizenz-Scan (C-25, Copyleft-Konflikte blockieren)
        run: node scripts/regime/license-scan.mjs
      - name: Lizenz-Selbsttest (A-36)
        run: node scripts/regime/license-scan.mjs --selftest
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  # ---- Mutation-Testing: das Meta-Gate über die Kernlogik (A-02, S4) --------
  # Der Test-Suite selbst wird geprüft: kann sie injizierte Fehler fangen?
  # break=78 (Baseline 82,91 %) blockiert eine Regression des Sicherheitsnetzes.
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Mutation-Score Kernlogik (blockiert unter 78 %)
        run: npm run mutation

  # ---- Deploy-Admission: beweist die fail-closed-Sperre (Artikel XV) --------
  # Der Job ist GRÜN, wenn die Admission KORREKT VERWEIGERT wird — solange
  # production_eligible=false (Track C ungeprüft), darf nichts nach Produktion.
  deploy-admission-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Admission muss fail-closed verweigern
        run: |
          if node scripts/regime/findings-gate.mjs --admission; then
            echo "FEHLER: Admission wurde freigegeben, obwohl production_eligible=false erwartet ist."
            exit 1
          else
            echo "OK: Deploy-Admission korrekt fail-closed verweigert."
          fi
