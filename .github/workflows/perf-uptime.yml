# Wächter gegen die ECHTE Domain: Erreichbarkeit + Gewicht der Startseite.
#
# WARUM ES DIESEN WORKFLOW GIBT (Befund 2026-08-15):
#  1. Die einzige Performance-Messung des Projekts stand als letzter Schritt im
#     DAST-Job — hinter einem fail-closed ZAP-Schritt und ohne `if:`. Alle vier
#     planmäßigen Läufe (20.07., 27.07., 03.08., 10.08.) endeten mit failure,
#     der Messschritt wurde jedes Mal übersprungen. Zusätzlich trug er `|| true`
#     und hätte ohnehin nie rot werden können. Vier Wochen lang wurde also
#     nichts gemessen — und niemand hat es bemerkt.
#  2. Gemessen wurde dort gegen localhost mit LEERER Datenbank. Genau die
#     Bilder, um die es geht, existieren dort nicht. Deshalb läuft die Messung
#     hier gegen die Produktion.
#  3. audit/slo.md führt als bekannte, ausdrücklich offene Lücke: bei einem
#     Totalausfall meldet sich niemand — der SLO-Monitor läuft IM Prozess, der
#     dann tot ist. Der /health-Schritt unten schließt das teilweise. Ehrliche
#     Grenze: GitHub-schedule ist nicht kadenztreu, die Erkennungszeit liegt bei
#     Stunden, nicht Minuten. Ein Minuten-genauer Wächter bräuchte einen
#     zweiten Host.
name: Perf & Uptime (Produktion)

on:
  schedule:
    - cron: "25 5 * * *" # täglich 05:25 UTC
  workflow_dispatch:
    inputs:
      melde_pfad_pruefen:
        description: "Meldepfad testen: erzwingt einen Fehlschlag (Gegenprobe für das Alarm-Issue)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write # für den Meldepfad unten

env:
  ZIEL: https://gourmetcompass.de

jobs:
  wachhund:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gegenprobe des Meldepfads: ohne einen erzwungenen Fehlschlag ist nie
      # belegt, dass der Alarm überhaupt ankommt. Genau dieser fehlende Nachweis
      # ist der Grund, warum vier rote DAST-Läufe unbemerkt blieben.
      - name: Gegenprobe — Fehlschlag erzwingen
        if: inputs.melde_pfad_pruefen
        run: |
          echo "Absichtlicher Fehlschlag zur Prüfung des Meldepfads."
          exit 1

      - name: Erreichbarkeit und ausgelieferter Stand
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 "$ZIEL/health")
          echo "HTTP $code"
          cat /tmp/health.json
          test "$code" = "200"
          node -e "
            const h = require('/tmp/health.json');
            if (h.status !== 'ok') { console.error('health meldet nicht ok:', h.status); process.exit(1); }
            if (!h.commit || h.commit === 'dev') { console.error('kein Commit ausgewiesen:', h.commit); process.exit(1); }
            console.log('Ausgelieferter Commit:', h.commit);
          "

      # Die Startseite selbst — VOR allem, was auf ihr aufbaut.
      #
      # `/health` ist eine eigene Route und kann 200 liefern, während die Seite
      # kaputt ist. Und eine Fehlerseite trägt weiterhin /_next/static/*.js:
      # der Schritt darunter hätte daraus fröhlich eine Chunk-URL gezogen und
      # grün gemeldet, Lighthouse hätte die Fehlerseite vermessen — die ist
      # KLEINER als die echte Startseite, die Budgets sähen also besser aus als
      # je zuvor (Befund gpt-5.6-sol, PR #63).
      #
      # Geprüft wird deshalb beides: der Status UND dass es wirklich die
      # Startseite ist. `section.featured-slider` ist die Bühne der Startseite;
      # dieselbe Marke nutzen die E2E-Tests. Eine Fehlerseite hat sie nicht.
      # Nur bei 200 mit Bühne läuft der Rest — sonst bricht der Lauf hier ab und
      # meldet, statt auf einer Fehlerseite Kennzahlen zu erheben.
      - name: Startseite liefert wirklich die Startseite
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/start.html -w '%{http_code}' --max-time 30 "$ZIEL/")
          echo "HTTP $code, $(wc -c < /tmp/start.html) Bytes"
          if [ "$code" != "200" ]; then
            echo "Startseite antwortet mit $code — hier wird nichts gemessen."
            exit 1
          fi
          if ! grep -q 'featured-slider' /tmp/start.html; then
            echo "Startseite ohne Bühne (section.featured-slider) — das ist nicht"
            echo "die Startseite, sondern vermutlich eine Fehlerseite mit Status 200."
            exit 1
          fi

      # Auslieferungs-Header der statischen Dateien. Prüft, was der Besucher
      # wirklich bekommt — nicht, was die Konfiguration behauptet.
      - name: Auslieferung der statischen Dateien
        run: |
          set -euo pipefail
          # Chunk-URL aus dem GEPRÜFTEN HTML des vorigen Schritts, nicht aus
          # einem neuen, ungeprüften Abruf.
          datei=$(grep -oE '/_next/static/[^"]+\.js' /tmp/start.html | head -1)
          test -n "$datei" || { echo "Keine Chunk-URL im HTML gefunden."; exit 1; }
          echo "Prüfe $datei"
          kopf=$(curl -sSI --max-time 20 -H 'Accept-Encoding: br,gzip' "$ZIEL$datei")
          echo "$kopf"
          echo "$kopf" | grep -qiE '^content-encoding: (br|gzip)' \
            || { echo "Statische Datei wird UNKOMPRIMIERT ausgeliefert."; exit 1; }
          echo "$kopf" | grep -qi 'immutable' \
            || { echo "Kein immutable-Cache auf der statischen Datei."; exit 1; }
          # Gegenprobe: ohne Accept-Encoding darf keine Kompression gemeldet
          # werden — sonst prüft der Schritt oben nichts.
          ohne=$(curl -sSI --max-time 20 -H 'Accept-Encoding: identity' "$ZIEL$datei")
          if echo "$ohne" | grep -qiE '^content-encoding: (br|gzip)'; then
            echo "Server komprimiert auch ohne Accept-Encoding — die Prüfung oben ist wertlos."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Gepinnt (B-13): eine gleitende Version würde die Messwerte unbemerkt
      # verschieben und das Budget wertlos machen.
      #
      # KEIN --budget-path: empirisch geprüft (12.8.2), mit
      # --only-categories=performance enthält der Report gar kein Audit
      # „performance-budget" — weder bei eingehaltenem noch bei gerissenem
      # Budget. Die Bewertung macht deshalb der eigene Auswerter unten, auf
      # Basis von „resource-summary" (echte Transfergrößen).
      - name: Lighthouse gegen die Produktion
        run: |
          set -euo pipefail
          npx --yes lighthouse@12.8.2 "$ZIEL/" \
            --only-categories=performance \
            --output=json --output-path=./lighthouse.json \
            --chrome-flags="--headless --no-sandbox --disable-gpu"

      - name: Budgets bewerten (fail-closed)
        run: node scripts/regime/lighthouse-budget.mjs ./lighthouse.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-produktion
          path: ./lighthouse.json

      # BEWUSST INLINE, nicht als Skript aus dem Repo (Befund gpt-5.6-sol,
      # PR #63, Runde 2): schlägt schon der Checkout fehl, existiert kein
      # Skript — der Alarm-Schritt liefe zwar, fände die Datei nicht und
      # meldete nichts. Ausgerechnet der Totalausfall des Laufs bliebe still.
      # Der Preis ist ein wiederholter Block in drei Workflows; die Alternative
      # wäre eine Kontrolle, die im wichtigsten Fall nicht greift.
      - name: Fehlschlag melden
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # OHNE GH_REPO leitet die gh-CLI das Repository aus dem git-Remote im
          # Arbeitsverzeichnis ab — nach einem fehlgeschlagenen Checkout gibt es
          # keines, und der Alarm scheitert mit „not a git repository". Genau im
          # gemeldeten Fall (Befund gpt-5.6-sol, PR #63, Runde 3).
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh label create kadenz-alarm --force --color B60205 \
            --description "Ein wiederkehrender Lauf ist fehlgeschlagen"
          titel="Wiederkehrender Lauf fehlgeschlagen: ${{ github.workflow }}"
          text="Lauf: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Commit: ${{ github.sha }}"
          nummer=$(gh issue list --label kadenz-alarm --state open \
            --search "$titel in:title" --json number --jq '.[0].number // empty')
          if [ -n "$nummer" ]; then
            gh issue comment "$nummer" --body "$text"
          else
            gh issue create --title "$titel" --label kadenz-alarm --body "$text"
          fi
